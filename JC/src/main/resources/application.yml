spring:
  application:
    name: JourneyCraft

  # MySQL DataSource
  datasource:
    url: jdbc:mysql://localhost:3306/journeycraft?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  # MongoDB
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/JourneyCraft}

  # File Upload
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

# Server
server:
  port: 8080

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:ThisIsAJourneyCraftSecretKeyForJWTTokenGeneration2026}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  amap:
    key: ${AMAP_KEY:08b8020c975156bbc4db6c064f9450dc}
    security-key: ${AMAP_SECURITY_KEY:28341ec39de806f9f2f40c4e655bceeb}

# Logging
logging:
  level:
    com.journeycraft: DEBUG
    org.springframework.security: INFO

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql:3306/journeycraft?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/JourneyCraft}
